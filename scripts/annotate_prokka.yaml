# ============================================================
# USER SETTINGS — edit these for each run
# ============================================================

# Name of the target gene. Used in:
#   - output subdirectory name: {genome_name}_{target_gene}/
#   - FASTA header prefix:      >{target_gene}_vs_{sample}|...
target_gene: Rgg144

# Root output directory. Each genome set gets a subdirectory here.
output_dir: /home/xinruoz/Document/Hiller/ud_search/Rgg144

# Number of CDS to extract on EACH SIDE of the target gene per strain.
# Total neighborhood per strain = up to 2 * max_genes.
max_genes: 20

# Root directory of pre-existing central Prokka annotations.
# Structure: {prokka_base_dir}/{prokka_species_name}/{strain}/{strain}.gff/.faa
prokka_base_dir: /mnt/extra_space/xinruoz/ud_search/annotation_prokka

# List of genome sets to process.
# genome_name         : human-readable label; becomes part of the output subdir name
# prokka_species_name : subfolder name inside prokka_base_dir for this species
# target_fasta        : FASTA with hit coordinates for this gene in this genome set
#                       Header format: >{target_gene}_vs_{sample}|contig=X|...|SubjectStart=N|SubjectEnd=M|...
genome_sets:
  - genome_name: S_oralis
    prokka_species_name: oralis
    target_fasta: /home/xinruoz/Document/Hiller/allele_search/results/so_rgg144/standard_dna_seq/Rgg144.fasta

  - genome_name: S_mitis
    prokka_species_name: mitis
    target_fasta: /home/xinruoz/Document/Hiller/allele_search/results/mitis_Rgg144/standard_dna_seq/Rgg144.fasta

  - genome_name: S_pneumo
    prokka_species_name: pneumo
    target_fasta: /home/xinruoz/Document/Hiller/allele_search/Rgg144_sp/standard_dna_seq/Rgg144.fasta

# ============================================================
# STABLE SETTINGS — change only when tools or environment change
# ============================================================

# Conda environment containing parallel
conda_env: ud_search

# Number of parallel jobs for neighborhood FAA extraction
parallel_jobs: 5
